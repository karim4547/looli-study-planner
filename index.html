<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6c6d4">
<title>Looli's Study Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: soft, cheerful, encouraging — a planner a friend decorated for you
   IDEA: a ribboned paper planner: pink cover band, milky pages, checkboxes that pop
   PICTURE: the working planner itself — today's ring, lists, week, grade cards
   COLOUR and TYPE: blush pink field, milky white pages, light grey, one rose accent; Fredoka + Nunito
   LAYOUT: pink header band with bow + tabs, then one view at a time, cards in a calm grid */
:root{color-scheme:light dark;
--bg:light-dark(#fff9fa,#221a1e);--page:light-dark(#ffffff,#2d2228);--ink:light-dark(#3b2a32,#f7eaef);
--muted:light-dark(#8b7680,#bfa9b3);--band:light-dark(#f8cfdb,#5a2c3f);--band2:light-dark(#fbe3ea,#3b2530);
--rose:light-dark(#d4457a,#ff8fb6);--grey:light-dark(#f1edef,#382c33);--line:light-dark(#f1dde4,#47363e);
--ok:light-dark(#3f9b86,#7fd6bf);--warn:light-dark(#c9622f,#ffad7a);--shadow:0 6px 22px light-dark(#e8b5c533,#0006)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5vw,40px)}h2{font-size:22px}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.band{background:var(--band);padding:22px max(5vw,16px) 0}
.top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px}
.top .bow{width:58px;height:42px;flex:none}
.top p{margin:2px 0 0;color:var(--ink);opacity:.8;font-weight:600}
.gear{margin-inline-start:auto;width:44px;height:44px;border-radius:50%;background:var(--page);display:grid;place-items:center;box-shadow:var(--shadow)}
nav{max-width:1100px;margin:18px auto 0;display:flex;gap:6px;overflow-x:auto}
nav button{flex:none;min-height:46px;padding:12px 20px;border-radius:18px 18px 0 0;font-weight:800;color:var(--ink);opacity:.75}
nav button[aria-current]{background:var(--bg);opacity:1;color:var(--rose)}
main{max-width:1100px;margin:auto;padding:24px max(5vw,16px) 60px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{background:var(--page);border-radius:22px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.end{justify-content:flex-end}.sp{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:14px}
.pri,.ghost,.chip{min-height:44px;padding:0 18px;border-radius:999px;font-weight:800}
.pri{background:var(--rose);color:#fff}.ghost{background:var(--grey)}
:root .pri{color:light-dark(#fff,#2a1520)}
.chip{background:var(--grey);min-height:38px;padding:0 14px;font-size:14px}.chip[aria-pressed=true]{background:var(--rose);color:light-dark(#fff,#2a1520)}
.icon{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--muted)}.icon:hover{background:var(--grey)}
input,select,textarea{width:100%;min-height:44px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
textarea{min-height:110px;font:13px/1.4 ui-monospace,monospace}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.ring{position:relative;width:132px;height:132px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:600 28px/1 Fredoka,sans-serif}
.ring b small{display:block;font:700 12px Nunito,sans-serif;color:var(--muted);margin-top:4px}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}.item:last-child{border:0}
.item .t{flex:1}.item.done .t span:first-child{text-decoration:line-through;color:var(--muted)}
.box{width:30px;height:30px;flex:none;border-radius:10px;border:2.5px solid var(--rose);display:grid;place-items:center;color:transparent}
.box[aria-checked=true]{background:var(--rose);color:light-dark(#fff,#2a1520)}
.box.pop{animation:pop .45s}@keyframes pop{40%{transform:scale(1.35) rotate(-8deg)}}
.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--grey);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tag.late{background:light-dark(#fde3d6,#4a2a1c);color:var(--warn)}.tag.hi{color:var(--rose)}
.meter{position:relative;height:16px;border-radius:99px;background:var(--grey);margin:4px 0 2px}
.meter i{position:absolute;top:0;bottom:0;border-radius:99px}.meter .m1{left:0;background:var(--c,var(--rose))}.meter .m2{background:repeating-linear-gradient(45deg,light-dark(#e9dfe3,#4a3a42) 0 6px,transparent 6px 12px);border-radius:0 99px 99px 0}
.meter b{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px}.meter b span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font:700 12px Nunito,sans-serif;white-space:nowrap}
.ccard{cursor:pointer;transition:transform .15s}.ccard:hover{transform:translateY(-3px)}.ccard .meter{margin-top:24px}
.goalchip{flex:none;font-weight:800;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--band2);color:var(--rose)}
.pill{display:inline-block;margin:12px 0 0;padding:6px 12px;border-radius:12px;font-size:14px;font-weight:700}
.pill.unset{background:light-dark(#fde3d6,#4a2a1c);color:var(--warn)}.pill.win,.pill.easy{background:light-dark(#dff3ec,#1f3a33);color:var(--ok)}.pill.ok{background:var(--band2);color:var(--rose)}.pill.hard,.pill.miss{background:light-dark(#fde3d6,#4a2a1c);color:var(--warn)}
.lchips{display:flex;flex-wrap:wrap;gap:8px}.lchip{min-width:52px;min-height:44px;border-radius:14px;background:var(--grey);font:600 18px Fredoka,sans-serif;transition:transform .15s}
.lchip:hover{transform:scale(1.08)}.lchip.got{background:light-dark(#dff3ec,#1f3a33);color:var(--ok)}.lchip.got::after{content:" ✓";font-size:13px}.lchip.no{opacity:.35}
.lchip[aria-pressed=true]{background:var(--rose);color:light-dark(#fff,#2a1520);transform:scale(1.1)}
.plan{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:2px;animation:rise .35s}@keyframes rise{from{transform:translateY(8px);opacity:.3}}.plan.win,.plan.easy{background:light-dark(#dff3ec,#1f3a33)}.plan.ok{background:var(--band2)}.plan.hard,.plan.miss{background:light-dark(#fde3d6,#4a2a1c)}
.needbig{font:600 44px/1.05 Fredoka,sans-serif;color:var(--rose)}.plan.hard .needbig{color:var(--warn)}.plan.easy .needbig{color:var(--ok)}
.split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.split div{background:var(--grey);border-radius:14px;padding:10px;text-align:center}.split b{display:block;font:600 22px Fredoka,sans-serif}.split small{color:var(--muted);font-size:12px}
.whatif{margin-top:14px;padding:14px;border:2px dashed var(--line);border-radius:18px}.whatif label{margin:0 0 6px;font-weight:600}
input[type=range]{padding:0;min-height:36px;border:0;background:none;accent-color:var(--rose)}
.proj{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}.projbig{font:600 40px/1.1 Fredoka,sans-serif}.projbig span{font-size:24px;padding:2px 10px;border-radius:10px;background:var(--grey);vertical-align:middle}.projbig.good{color:var(--ok)}.projbig.bad{color:var(--warn)}
.whatif label{display:block;margin-top:8px}
.finres{font-size:18px;margin-top:4px}.finres b{font:600 28px Fredoka,sans-serif;color:var(--rose)}.finres.bad{color:var(--warn)}.finres.good{color:var(--ok)}
.aims{list-style:none;margin:0;padding:0}.aims li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}.aims li b{text-align:right;color:var(--rose)}.aims li b.bad{color:var(--warn)}.aims li b.ok{color:var(--ok)}
.ed{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}.ed summary{cursor:pointer;font:600 18px Fredoka,sans-serif;min-height:40px;display:flex;align-items:center}
.grp{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px;margin:10px 0}
.grphead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}.grphead>input{flex:1 1 180px;font-weight:700}
.mini{display:flex;align-items:center;gap:4px;margin:0;font-size:13px;font-weight:700}.mini input,.mini select{width:auto;min-height:38px;padding:4px 8px}.mini input[type=number]{width:70px}
.itm{display:grid;grid-template-columns:minmax(0,1fr) 80px 10px 70px 64px 36px;gap:6px;align-items:center;margin:4px 0}.itm input{min-height:38px;padding:4px 10px}.itm .sc{text-align:right}.itm .pct{font-size:13px;color:var(--muted);text-align:right}
.itm.dropped input{opacity:.45;text-decoration:line-through}
@media(max-width:520px){.itm{grid-template-columns:minmax(0,1fr) 64px 8px 56px 30px}.itm .pct{display:none}}
.conf{position:fixed;inset:0;pointer-events:none;z-index:20}.conf i{position:absolute;bottom:30%;width:9px;height:14px;border-radius:3px;animation:fly 1.4s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.gpa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:center;margin-bottom:18px;background:var(--band2)}
.gpacol small{display:block;color:var(--muted);font-size:13px}.gpacol b{display:block;font:600 34px/1.1 Fredoka,sans-serif}.gpacol .up,.gpacol .down{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px}.gpacol .up{background:light-dark(#dff3ec,#1f3a33);color:var(--ok)}.gpacol .down{background:light-dark(#fde3d6,#4a2a1c);color:var(--warn)}
@media(max-width:700px){.gpa{grid-template-columns:repeat(3,minmax(0,1fr))}.gpa>button{grid-column:1/-1}.gpacol b{font-size:26px}}
.lbl{margin:10px 0 0;font-size:12px;font-weight:800;color:var(--muted);text-transform:none}.free{color:var(--ok);font-weight:700;margin:10px 0}
.sess.cls time{font-size:15px}.sess.cls time small{display:block;font:600 12px Nunito,sans-serif;color:var(--muted)}
.livepill{display:inline-block;margin:8px 0 0;padding:6px 14px;border-radius:99px;background:var(--page);font-weight:800;font-size:14px;color:var(--rose);box-shadow:var(--shadow)}.livepill[hidden]{display:none}
.live{margin-bottom:18px;background:linear-gradient(135deg,var(--page),var(--band2))}.liverow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:center}
@media(max-width:700px){.liverow{grid-template-columns:1fr}}
.nowc{display:flex;align-items:center;gap:14px}.nowtxt{flex:1}.nowtxt small,.next small{display:block;font-size:12px;font-weight:800;color:var(--muted)}.nowtxt b{display:block;font:600 26px/1.15 Fredoka,sans-serif}.nowtxt span,.next span{font-size:14px;color:var(--muted)}
.next{border-left:2px dashed var(--line);padding-left:18px}.next b{display:block;font:600 19px/1.2 Fredoka,sans-serif}@media(max-width:700px){.next{border-left:0;padding-left:0;border-top:2px dashed var(--line);padding-top:12px}}
.pulse{width:16px;height:16px;border-radius:50%;background:var(--c,var(--rose));flex:none;box-shadow:0 0 0 0 var(--c,var(--rose));animation:pulse 1.6s infinite}.pulse.off{background:var(--grey);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}.livebar{margin-top:12px}.livebar i{background:var(--c,var(--rose))}
.tag.okt{background:light-dark(#dff3ec,#1f3a33);color:var(--ok)}.tag.flame{color:var(--warn)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:18px;margin-bottom:18px;align-items:stretch}.hero .stats{margin:0;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
.lvl{display:flex;gap:18px;align-items:center}.lvring{--p:0;width:96px;height:96px;flex:none;border-radius:50%;background:conic-gradient(var(--rose) calc(var(--p)*1%),var(--grey) 0);display:grid;place-items:center;position:relative}
.lvring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--page)}.lvring b,.lvring small{position:relative}.lvring b{font:600 34px/1 Fredoka,sans-serif;margin-top:18px}.lvring small{font-size:11px;font-weight:800;color:var(--muted);margin-top:-22px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:14px}.badge{text-align:center;padding:12px 8px;border-radius:18px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.badge b{display:block;color:var(--ink);font-size:14px;margin-top:4px}.badge small{font-size:12px}.badge.on{background:var(--band2);border-color:transparent}.badge.on svg{animation:shine 3s ease-in-out infinite}.badge:not(.on){filter:grayscale(1);opacity:.7}
@keyframes shine{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg) scale(1.06)}}
.cp{margin-top:12px;cursor:pointer;border-radius:12px;padding:2px 4px}.cp:hover{background:var(--grey)}.cph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}.cpn{display:flex;gap:6px;align-items:center;min-width:0}.cpn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.cp .meter{margin-top:24px}
.evli{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}.evli .t{flex:1}.evli.exam .t{font-weight:800}.evli.done .t{text-decoration:line-through;color:var(--muted)}
.calwrap{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:18px;align-items:start}@media(max-width:900px){.calwrap{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.dow{font-size:12px;font-weight:800;color:var(--muted);text-align:center;padding-bottom:4px}
.cell{min-height:96px;border-radius:14px;background:var(--bg);border:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;transition:transform .15s,background .15s}.cell:hover{transform:translateY(-2px);background:var(--band2)}
.cell.blank{visibility:hidden}.cell.today{outline:2.5px solid var(--rose)}.cell.sel{background:var(--band2);border-color:var(--rose)}.cell.past{opacity:.6}
.cell .n{font-weight:800;font-size:14px;display:flex;align-items:center;gap:4px}.cdot{width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block}
.ev{font-size:11px;font-weight:700;line-height:1.3;border-radius:6px;padding:2px 5px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev.exam{background:var(--c);color:#fff}.ev.range{border-left:3px solid var(--c);border-radius:3px;background:color-mix(in srgb,var(--c) 10%,transparent)}.ev.done{opacity:.5;text-decoration:line-through}.more{font-size:11px;color:var(--muted);font-weight:700}
@media(max-width:600px){.cell{min-height:58px;padding:4px}.ev{font-size:0;height:6px;padding:0}.more{font-size:10px}}
.dayp h3{margin-bottom:6px}.big-ic{font-size:26px;color:var(--ink)}
.anim{animation:up .55s cubic-bezier(.2,.7,.3,1) both}@keyframes up{from{opacity:0;transform:translateY(16px) scale(.98)}}
.grow{animation:grow 1.1s cubic-bezier(.2,.7,.3,1) both}@keyframes grow{from{width:0}}.lvring.grow{animation:spin .9s cubic-bezier(.2,.7,.3,1) both}@keyframes spin{from{transform:rotate(-120deg) scale(.6);opacity:0}}
.xpfloat{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);font:600 26px Fredoka,sans-serif;color:var(--rose);z-index:11;pointer-events:none;animation:xp 1.2s ease-out forwards}@keyframes xp{to{transform:translate(-50%,-80px);opacity:0}}
#view{animation:none}
@media(prefers-reduced-motion:reduce){.anim,.grow,.pulse,.badge.on svg,.xpfloat{animation:none!important}}
.band{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--band),light-dark(#fbe0e9,#4a2436),var(--band));background-size:200% 100%}
@keyframes bandmove{to{background-position:100% 0}}
.floaters{position:absolute;inset:0;pointer-events:none}.fl{position:absolute;opacity:.55;animation:floaty 9s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(20deg)}}
.top,nav{position:relative}.top .bow{animation:bowwig 4s ease-in-out infinite;transform-origin:50% 40%}@keyframes bowwig{0%,100%{transform:rotate(0)}10%{transform:rotate(-10deg)}20%{transform:rotate(8deg)}30%{transform:rotate(0)}}
nav .ind{position:absolute;left:0;bottom:0;height:100%;border-radius:18px 18px 0 0;background:var(--bg);transition:transform .45s cubic-bezier(.3,1.4,.5,1),width .45s cubic-bezier(.3,1.4,.5,1);z-index:0}
nav button{position:relative;z-index:1;transition:color .3s,opacity .3s}nav button[aria-current]{background:transparent!important}
.viewin{animation:viewin .45s cubic-bezier(.2,.7,.3,1)}@keyframes viewin{from{opacity:0;transform:translateY(10px)}}
.card{transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s}.card:hover{box-shadow:0 12px 34px light-dark(#e8b5c555,#000a)}
main>.row h2,main>div>.row h2{font-size:28px;text-decoration:underline wavy light-dark(#f3b0c6,#7a3a52) 2px;text-underline-offset:8px}
.live.on{border:2px solid transparent;background:linear-gradient(var(--page),var(--page)) padding-box,linear-gradient(90deg,#e2638f,#9b7fd4,#ee9257,#e2638f) border-box;background-size:100% 100%,100% 100%;animation:none infinite}
@keyframes border{to{background-position:0 0,300% 0}}
.pings{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;margin:-4px 0 8px;scroll-snap-type:x mandatory}
.nudge{flex:0 0 min(320px,85%);scroll-snap-align:start;display:flex;gap:12px;align-items:center;background:var(--page);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow)}
.nudge>div{flex:1}.nudge b{display:block;font-size:15px}.nudge small{color:var(--muted);font-size:13px;line-height:1.35;display:block}
.nic{width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}
.ccard{position:relative;overflow:hidden;isolation:isolate}.ccard::before{content:"";position:absolute;z-index:-1;width:160px;height:160px;border-radius:50%;background:var(--cc);opacity:.13;top:-70px;right:-50px;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.ccard:hover::before{transform:scale(1.6)}.ccard:hover{transform:translateY(-4px) rotate(-.3deg)}
.m1{position:relative;overflow:hidden}.m1::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:sheen 3.5s ease-in-out 1.2s infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.bst{position:fixed;width:8px;height:8px;border-radius:50%;z-index:30;pointer-events:none;margin:-4px 0 0 -4px;animation:bst .7s cubic-bezier(.2,.7,.3,1) forwards}.bst.hrt{border-radius:2px;transform:rotate(45deg)}
@keyframes bst{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.box{transition:transform .2s,background .2s}.box:hover{transform:scale(1.1)}
.fab{position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;background:var(--rose);color:light-dark(#fff,#2a1520);display:grid;place-items:center;box-shadow:0 10px 26px light-dark(#d4457a66,#0009);z-index:8;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.fab:hover{transform:rotate(90deg) scale(1.08)}

   Storage: issues labelled "space" in the private data repo. Each person's presence is one issue body (JSON),
   shared state (games, places, dates, stats) is another, and append-only things (notes, nudges, answers) are comments.
   Needs a key with Issues: read and write on that repo. Location is only shared while the app is open. */

async function gh(path,opt={}){const c=syncCfg();if(!c.token)throw new Error('nokey');
  const get=!opt.method||opt.method==='GET',hit=get&&SP.etag[path],h={Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','Content-Type':'application/json'};
  if(hit)h['If-None-Match']=hit.e;
  const r=await fetch(`https://api.github.com/repos/${c.repo||'karim4547/looli-data'}${path}`,{cache:'no-store',...opt,headers:h});
  if(r.status===304&&hit)return hit.d;
  if(r.status===401||r.status===403||r.status===404){const e=new Error('perm');e.status=r.status;throw e}
  if(!r.ok)throw new Error('http '+r.status);const d=r.status===204?null:await r.json();
  if(get&&r.headers.get('ETag'))SP.etag[path]={e:r.headers.get('ETag'),d};return d}
const enc=o=>'Our space data, managed by the planner app. Please don\'t edit by hand.\n\n```json\n'+JSON.stringify(o)+'\n```';
const dec=b=>{const m=(b||'').match(/```json\n([\s\S]*?)\n```/);try{return m?JSON.parse(m[1]):null}catch(e){return null}};
async function spIssue(title,init){if(SP.issues[title])return SP.issues[title];
  const made=await gh('/issues',{method:'POST',body:JSON.stringify({title:'space:'+title,body:enc(init)})});
  try{const list=await gh('/issues?state=open&per_page=100&sort=created&direction=asc');const first=list.find(i=>i.title==='space:'+title);if(first&&first.number<made.number){gh(`/issues/${made.number}`,{method:'PATCH',body:JSON.stringify({state:'closed'})}).catch(()=>{});SP.issues[title]=first;return first}}catch(e){}
  SP.issues[title]=made;return made}
async function spPull(withComments=true){if(SP.loading)return;SP.loading=true;
  try{const list=await gh('/issues?state=open&per_page=100&sort=created&direction=asc');const map={};
    const dup=[];for(const i of list)if(i.title.startsWith('space:')&&!i.pull_request){const k=i.title.slice(6);if(!map[k])map[k]=i;else if(map[k].number>i.number){dup.push(map[k]);map[k]=i}else dup.push(i)}
    for(const k in map)SP.issues[k]=map[k];
    for(const i of dup)gh(`/issues/${i.number}`,{method:'PATCH',body:JSON.stringify({state:'closed'})}).catch(()=>{});
    for(const w of ['karim','looli'])SP.pres[w]=dec(SP.issues['presence:'+w]?.body)||SP.pres[w]||null;
    if(Date.now()-(SP.sharedHold||0)>4000)SP.shared={...DEFAULT_SHARED(),...(dec(SP.issues['shared']?.body)||SP.shared||{})};
    if(withComments||!SP.issues.board){const board=await spIssue('board',{});const since=SP.since||'';const started=new Date(Math.floor((Date.now()-180000)/3600000)*3600000).toISOString();
    let cm=[];for(let pg=1;pg<=5;pg++){const part=await gh(`/issues/${board.number}/comments?per_page=100&page=${pg}${since?'&since='+encodeURIComponent(since):''}`);cm=cm.concat(part);if(part.length<100)break}
    for(const c of cm){if(SP.comments.some(x=>x.id===c.id))continue;const o=dec(c.body);if(o)SP.comments.push({...o,id:c.id,at:c.created_at})}
    SP.comments.sort((a,b)=>a.at<b.at?-1:1);SP.since=started}SP.err='';SP.last=Date.now();spInbox();spTogether();
  }catch(e){SP.err=e.message==='nokey'?'nokey':e.status?'perm':'net'}
  finally{SP.loading=false}
  if(cur==='space')spPaint()}
async function spSaveShared(fn){if(!SP.shared)await spPull();const s=SP.shared||DEFAULT_SHARED();fn(s);SP.shared=s;SP.sharedHold=Infinity;spPaint();
  try{const i=await spIssue('shared',s);let fresh=s;try{const f=await gh(`/issues/${i.number}`);const d=dec(f.body);if(d){fresh={...DEFAULT_SHARED(),...d};fn(fresh)}}catch(e){}
    SP.shared=fresh;await gh(`/issues/${i.number}`,{method:'PATCH',body:JSON.stringify({body:enc(fresh)})});SP.issues['shared'].body=enc(fresh)}finally{SP.sharedHold=Date.now()-3000}spPaint()}
async function spPost(o){const b=await spIssue('board',{});const c=await gh(`/issues/${b.number}/comments`,{method:'POST',body:JSON.stringify({body:enc({...o,from:ME,ts:Date.now()})})});

const inPolyXY=(x,y,a)=>{let c=false;for(let i=0,j=a.length-2;i<a.length;j=i,i+=2){const xi=a[i],yi=a[i+1],xj=a[j],yj=a[j+1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c};
const BLD=CM.b.map(([name,lv,a])=>({name,lv,a,c:cen(a)}));
const HALLS=Object.fromEntries(CM.poi.filter(p=>p[0]==='hall').map(p=>[p[1],[p[2],p[3]]]));
function roomSpot(room){if(!room)return null;const r=room.toUpperCase().replace(/\s/g,'');
  if(HALLS[r])return {xy:HALLS[r],label:'Hall '+r};const m=r.match(/^([A-Z]\d?)\./)||r.match(/^([A-Z]\d)/);if(!m)return null;
  const b=BLD.find(b=>b.name.toUpperCase()===m[1])||BLD.find(b=>b.name.toUpperCase().startsWith(m[1][0])&&m[1].length===1);return b?{xy:b.c,label:b.name}:null}

  if(p.room&&!p.ghost){const s=roomSpot(p.room);if(s)return {xy:s.xy,gps:false,label:s.label}}return null}
function buildingAt(x,y){return BLD.find(b=>b.name&&inPolyXY(x,y,b.a))}
const BCOL=n=>{const L=(n||'')[0];return {B:'b',C:'c',D:'d',G:'g',H:'h'}[L]||(n?'n':'x')};
function campusSvg(){const [bx,by,bw,bh]=CM.box,hud=HUD;
  const bl=BLD.map(b=>{const k=BCOL(b.name),h=Math.min(4,b.lv||1)*2.2;
    return `<g class="bd ${k}${b.name?' named':''}" data-b="${esc(b.name)}"><polygon class="side" points="${pts(b.a)}" transform="translate(${h*.6},${h})"/><polygon class="top" points="${pts(b.a)}"/></g>`}).join('');

  const poi=CM.poi.map(([k,n,x,y])=>k==='hall'?`<g class="hall" transform="translate(${x},${y})"><circle r="5.5"/><text y="2">${esc(n)}</text></g>`
    :k==='food'?`<g class="poi food" transform="translate(${x},${y})"><text class="ico">${n.match(/caf|aroma|pronto/i)?'☕':'🍔'}</text><text class="pn" y="11">${esc(n)}</text></g>`
    :k==='gate'?`<g class="poi gate" transform="translate(${x},${y})"><rect x="-4" y="-4" width="8" height="8" rx="2"/><text class="pn" y="12">${esc(n.replace(/\s*\(.*\)/,''))}</text></g>`:'').join('');
  return `<svg id="cmap" class="cmap" viewBox="${bx} ${by} ${bw} ${bh}" role="img" aria-label="Map of the GUC campus" preserveAspectRatio="xMidYMid meet">
  <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" class="gridl"/></pattern>
    <pattern id="grass" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" class="gr0"/><circle cx="2" cy="2" r=".8" class="gr1"/><circle cx="6" cy="6" r=".8" class="gr1"/></pattern>

  <rect x="${bx-400}" y="${by-400}" width="${bw+800}" height="${bh+800}" class="sea"/>
  ${hud?`<rect x="${bx-400}" y="${by-400}" width="${bw+800}" height="${bh+800}" fill="url(#grid)"/>`:''}
  <g id="cvp">

  <g class="compass" transform="translate(${bx+bw-46},${by+46})"><circle r="26"/><path d="M0-20L6 0 0 20-6 0Z"/><path class="n" d="M0-20L6 0H-6Z"/><text y="-30">N</text></g>
  <g class="cartouche" transform="translate(${bx+14},${by+14})"><rect width="${hud?250:230}" height="40" rx="${hud?2:20}"/><text x="18" y="26">${hud?'GUC // CAMPUS GRID':'GUC · our little campus 💞'}</text></g>
</svg>`}
const CV={s:1,tx:0,ty:0,W:0,H:0,k0:1,ox:0,oy:0,z:''};
function cmMeasure(){const el=$('#spmap');if(!el)return false;const r=el.getBoundingClientRect();if(!r.width)return false;const [bx,by,bw,bh]=CM.box;
  CV.W=r.width;CV.H=r.height;CV.k0=Math.min(CV.W/bw,CV.H/bh);CV.ox=(CV.W-bw*CV.k0)/2;CV.oy=(CV.H-bh*CV.k0)/2;return true}
const m2p=(x,y)=>{const [bx,by]=CM.box;return [(CV.ox+(x-bx)*CV.k0)*CV.s+CV.tx,(CV.oy+(y-by)*CV.k0)*CV.s+CV.ty]};
const p2m=(px,py)=>{const [bx,by]=CM.box;return [bx+((px-CV.tx)/CV.s-CV.ox)/CV.k0,by+((py-CV.ty)/CV.s-CV.oy)/CV.k0]};
function cmClamp(){const [,,bw,bh]=CM.box,l=CV.ox*CV.s,r=(CV.ox+bw*CV.k0)*CV.s,t=CV.oy*CV.s,b=(CV.oy+bh*CV.k0)*CV.s;
  /* any corner can be brought to the middle of the screen, never further */
  CV.tx=Math.min(CV.W*.6-l,Math.max(CV.W*.4-r,CV.tx));CV.ty=Math.min(CV.H*.6-t,Math.max(CV.H*.4-b,CV.ty));
  if(CV.s<=1.001){CV.tx=0;CV.ty=0}}
let cmRaf=0;function cmApply(){if(cmRaf)return;cmRaf=requestAnimationFrame(()=>{cmRaf=0;cmApplyNow()})}
function cmApplyNow(){const ly=$('#cmlayer');if(!ly)return;cmClamp();ly.style.transform=`translate3d(${CV.tx.toFixed(1)}px,${CV.ty.toFixed(1)}px,0) scale(${CV.s.toFixed(4)})`;
  const z=CV.s>=4.5?'max':CV.s>=3.2?'far':CV.s>=1.9?'mid':'near';if(z!==CV.z){CV.z=z;const m=$('#cmap');if(m)m.dataset.z=z}cmPlace()}
function cmZoomAt(f,px,py){const ns=Math.max(1,Math.min(6,CV.s*f));if(px==null){px=CV.W/2;py=CV.H/2}CV.tx=px-(px-CV.tx)*ns/CV.s;CV.ty=py-(py-CV.ty)*ns/CV.s;CV.s=ns;cmApply()}
function cmFocus(xy,s=3){CV.s=s;const [px,py]=m2p(...xy);CV.tx+=CV.W/2-px;CV.ty+=CV.H/2-py;cmApply()}
function cmGesture(on){const ly=$('#cmlayer');if(!ly)return;clearTimeout(CV.gt);if(on)ly.style.willChange='transform';else CV.gt=setTimeout(()=>{ly.style.willChange='auto'},180)}
function cmBind(){const el=$('#spmap');if(!el||el.dataset.bound)return;el.dataset.bound=1;cmMeasure();cmApplyNow();
  const ptrs=new Map();let st=null,moved=false,lp=null,lastTap=0;
  const local=e=>{const r=el.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  const begin=()=>{const v=[...ptrs.values()];if(v.length===1){const [x,y]=local(v[0]);st={x,y,tx:CV.tx,ty:CV.ty,s:CV.s}}else if(v.length>=2){const [a,b]=v.map(local);st={mx:(a[0]+b[0])/2,my:(a[1]+b[1])/2,d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,tx:CV.tx,ty:CV.ty,s:CV.s,pinch:1}}};
  el.addEventListener('pointerdown',e=>{if(e.target.closest('.cmctl,[data-who],[data-pl]'))return;el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,e);moved=ptrs.size>1;begin();cmGesture(true);
    clearTimeout(lp);if(ptrs.size===1){const [x,y]=local(e);lp=setTimeout(()=>{if(!moved){moved=true;spPinMenu(toLL(...p2m(x,y)))}},600)}});
  el.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)||!st)return;ptrs.set(e.pointerId,e);const v=[...ptrs.values()];
    if(st.pinch&&v.length>=2){const [a,b]=v.map(local),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,d=Math.hypot(a[0]-b[0],a[1]-b[1]);
      const ns=Math.max(1,Math.min(6,st.s*d/st.d));CV.s=ns;CV.tx=mx-(st.mx-st.tx)*ns/st.s;CV.ty=my-(st.my-st.ty)*ns/st.s;moved=true;clearTimeout(lp);cmApply();return}
    const [x,y]=local(e);if(!moved&&Math.hypot(x-st.x,y-st.y)>6){moved=true;clearTimeout(lp)}if(moved){CV.tx=st.tx+(x-st.x);CV.ty=st.ty+(y-st.y);cmApply()}});

        if(now-lastTap<300){lastTap=0;cmZoomAt(2,x,y);return}lastTap=now;const mx=p2m(x,y);setTimeout(()=>{if(lastTap===now)cmTap(mx[0],mx[1])},260)}st=null}else begin()};

  el.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=local(e);cmGesture(true);cmZoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0018)),x,y);cmGesture(false)},{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('click',e=>{const a=e.target.closest('[data-who]');if(a)return spWho(a.dataset.who);const q=e.target.closest('[data-pl]');if(q){const p=(SP.shared?.places||[]).find(x=>x.id===q.dataset.pl);if(p)spPlace(p)}});

function cmTap(x,y){const b=buildingAt(x,y);if(!b)return;const mine=(S.classes||[]).filter(k=>{const s=roomSpot(k.room);return s&&s.label===b.name});
  const here=['karim','looli'].filter(w=>{const s=spotOf(w===ME?myPres():SP.pres[w]);return s&&buildingAt(...s.xy)===b});
  modal(`<h2>${esc(b.name)}</h2><p class="muted small">${b.lv>1?b.lv+' floors':'Ground floor'}${here.length?' · '+here.map(w=>WHO[w].emoji+' '+(w===ME?'you':WHO[w].name)).join(', ')+' here now':''}</p>
    ${mine.length?`<h3>Your classes here</h3><ul class="list">${mine.map(k=>`<li class="item"><span>${esc(DAYS[k.day])} ${esc(PER[k.period]?.[0]||'')} · ${esc(CN(C(k.course))||k.course)} ${esc(k.kind||'')} <span class="muted">${esc(k.room||'')}</span></span></li>`).join('')}</ul>`:''}
    <div class="row end"><button class="ghost" data-act="spPinHere" data-id="${b.c[0].toFixed(1)},${b.c[1].toFixed(1)}">Pin something here</button><button class="pri" data-act="close">Close</button></div>`)}
function spMap(){const el=$('#spmap');if(!el)return;if(!el.querySelector('#cmap')){el.innerHTML=`<div id="cmlayer" class="cmlayer">${campusSvg()}</div><div id="cmov" class="cmov"></div><div class="cmctl"><button data-act="cmZ" data-id="in" aria-label="Zoom in">+</button><button data-act="cmZ" data-id="out" aria-label="Zoom out">−</button><button data-act="cmHome" aria-label="Back to the whole campus" title="Back to GUC">🏫</button></div>`;cmBind()}spMarkers()}
/* overlay: avatars, pins, flags as light HTML on top of the map (cheap to animate and move) */
function spMarkers(){const ov=$('#cmov');if(!ov)return;const items=[],spots={};
  for(const w of ['karim','looli']){const p=w===ME?myPres():SP.pres[w],s=spotOf(p);if(!s)continue;spots[w]=s;const fresh=p&&Date.now()-p.ts<5*60000;
    items.push({k:'av-'+w,xy:s.xy,z:3,html:`<button class="oav ${w} ${fresh?'fresh':'stale'} ${s.gps?'gps':'cls'}" data-who="${w}" aria-label="${WHO[w].name}"><span class="pulse2"></span><b>${WHO[w].emoji}</b>${p.mood?`<i>${esc(p.mood)}</i>`:''}<em>${s.gps?'':'📚 '}${WHO[w].name}</em></button>`})}

  if(spLocal().tuts)for(const w of ['karim','looli']){const p=w===ME?myPres():SP.pres[w],nt=p?.nt;if(!nt)continue;const r=roomSpot(nt.room);if(!r)continue;

  const sig=JSON.stringify(items.map(i=>[i.k,i.html]));SP.spots=spots;CV.items=items;CV.tie=spots.karim&&spots.looli?[spots.karim.xy,spots.looli.xy]:null;
  if(sig!==CV.sig){CV.sig=sig;ov.innerHTML=`<div class="otie"></div>`+items.map(i=>`<div class="ovi" data-k="${i.k}" style="z-index:${i.z}">${i.html}</div>`).join('')}

function cmPlace(){const ov=$('#cmov');if(!ov||!CV.items)return;const nodes=ov.querySelectorAll('.ovi');

function spFit(){const s=Object.values(SP.spots||{});if(s.length===2){const [a,b]=[s[0].xy,s[1].xy],d=Math.hypot(a[0]-b[0],a[1]-b[1]);cmFocus([(a[0]+b[0])/2,(a[1]+b[1])/2],Math.max(1.2,Math.min(5,(Math.min(CV.W,CV.H)*.6)/((d+60)*CV.k0))))}else if(s.length)cmFocus(s[0].xy,4);else{CV.s=1;cmApply()}}

const avatarHtml=(w,p)=>{const fresh=p&&Date.now()-p.ts<5*60000;return `<div class="av ${w} ${fresh?'fresh':'stale'}"><span class="ring"></span><b>${WHO[w].emoji}</b>${p?.mood?`<i>${esc(p.mood)}</i>`:''}<em>${WHO[w].name}</em></div>`};

/* ---------- inbox: nudges arriving ---------- */
const PINGS={heart:['💗','is thinking of you'],wave:['👋','is asking where you are'],coffee:['☕','wants a coffee break with you'],study:['📚','wants to study with you'],hug:['🫂','sent you a hug'],meet:['📍','dropped a pin for you on the map']};

/* ---------- together streak & study-together ---------- */

  if(distM(a,b)<60){const d=today(),s=SP.shared;if(s&&!(s.stats?.together||[]).includes(d)){spSaveShared(x=>{x.stats=x.stats||{};x.stats.together=[...new Set([...(x.stats.together||[]),d])]}).then(()=>{floatHearts('💞');celebrate('Together on campus today! 💞')})}}}
function streak(days){const set=new Set(days||[]);let n=0,d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);for(;;){const k=iso(d);if(!set.has(k))break;n++;d.setDate(d.getDate()-1)}return n}

  spPing(k){spPost({t:'ping',k}).then(()=>{floatHearts(PINGS[k][0]);toast(`Sent ${PINGS[k][0]} to ${WHO[YOU].name}.`)}).catch(()=>toast('Couldn\'t send. Check the connection.'))},
  spMood(m){spSet({mood:spLocal().mood===m?'':m});spSendMe({},true);spPaint()},
  spNote(){modal(`<h2>Leave a note</h2><form id="nf"><label for="nt">Your note for ${WHO[YOU].name}</label><textarea id="nt" name="t" rows="4" maxlength="280" required></textarea><label>Colour</label><div class="row">${[0,1,2,3,4].map(i=>`<label class="sw c${i}"><input type="radio" name="c" value="${i}" ${i===0?'checked':''}><span></span></label>`).join('')}</div><div class="row end" style="margin-top:14px"><button type="button" class="ghost" data-act="close">Cancel</button><button class="pri">Stick it</button></div></form>`);
    $('#nf').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);close();spPost({t:'note',text:d.get('t').trim(),c:+d.get('c')})}},
  spDelNote(id){spDel(+id)},
  spAddDate(){form('New countdown',[{k:'name',label:'What',req:1},{k:'emoji',label:'Emoji',value:'⏳'},{k:'date',label:'Date',type:'date',value:today(),req:1}],v=>{spSaveShared(s=>{s.dates=[...(s.dates||[]),{id:uid(),...v}]})})},
  spDelDate(id){spSaveShared(s=>{s.dates=(s.dates||[]).filter(x=>x.id!==id)})},
  spDelPlace(id){close();spSaveShared(s=>{s.places=(s.places||[]).filter(x=>x.id!==id)})},
  spFocus(v){if(v==='0'){const f=spLocal().focus;spSet({focus:null});spSendMe({},true);if(f&&f.withYou)spSaveShared(s=>{s.stats.studyMins=(s.stats.studyMins||0)+Math.max(0,(Date.now()-f.start)/60000)});spPaint();return}
    const you=SP.pres[YOU],join=v==='join'&&focusLeft(you?.focus);const until=join?you.focus.until:Date.now()+(+v)*60000;
    spSet({focus:{until,start:Date.now(),withYou:!!join||!!focusLeft(you?.focus)}});spSendMe({},true);if(join)spPost({t:'ping',k:'study'});toast(join?`Studying with ${WHO[YOU].name} 💞`:'Focus on. '+WHO[YOU].name+' can see it.');spPaint();
    clearTimeout(SP.ft);SP.ft=setTimeout(()=>{const f=spLocal().focus;if(f&&f.until<=Date.now()+1000){spSet({focus:null});if(f.withYou)spSaveShared(s=>{s.stats.studyMins=(s.stats.studyMins||0)+(f.until-f.start)/60000});celebrate('Focus session done! 🎉');spSendMe({},true)}},until-Date.now())},
  spTTT(i){spSaveShared(s=>{const g=s.ttt;if(g.win||g.turn!==ME||g.b[i]!=='.')return;g.b=g.b.slice(0,+i)+sym(ME)+g.b.slice(+i+1);const w=tttWin(g.b);if(w){g.win=w==='draw'?'draw':whoOf(w);if(g.win!=='draw')g.score[g.win]=(g.score[g.win]||0)+1}else g.turn=YOU}).then(()=>{if(SP.shared.ttt.win===ME)celebrate('You win tic-tac-toe! 🏆')})},
  spC4(col){spSaveShared(s=>{const g=s.c4;if(g.win||g.turn!==ME)return;col=+col;let r=5;while(r>=0&&g.b[r*7+col]!=='.')r--;if(r<0)return;const i=r*7+col;g.b=g.b.slice(0,i)+sym(ME)+g.b.slice(i+1);const w=c4Win(g.b);if(w){g.win=w==='draw'?'draw':whoOf(w);if(g.win!=='draw')g.score[g.win]=(g.score[g.win]||0)+1}else g.turn=YOU}).then(()=>{if(SP.shared.c4.win===ME)celebrate('Four in a row! 🏆')})},
  spNew(k){spSaveShared(s=>{const d=DEFAULT_SHARED()[k];const loser=s[k].win&&s[k].win!=='draw'?(s[k].win==='karim'?'looli':'karim'):YOU;s[k]={...d,score:s[k].score,turn:loser}})},
  spRPS(x){spSaveShared(s=>{const g=s.rps;if(g[ME])return;g[ME]=x;if(g[YOU]){const beats={'✊':'✌️','✋':'✊','✌️':'✋'},a=g[ME],b=g[YOU];const win=a===b?'':beats[a]===b?ME:YOU;if(win)g.score[win]=(g.score[win]||0)+1;
      g.last=`${WHO[ME].name} ${a} vs ${b} ${WHO[YOU].name}: ${win?WHO[win].name+' wins':'tie'}`;g.karim='';g.looli='';g.round++}}).then(()=>{const g=SP.shared.rps;if(g.last&&g.last.includes(WHO[ME].name+' wins'))floatHearts('🏆')})}
});
V.space=()=>{spStart();const h=spView();SP.lastHtml=h;setTimeout(()=>{spMap();spRoute();spBind();document.querySelector('nav [data-id=space]')?.classList.remove('ping')},0);return h};
VIEWS.push('space');if(location.hash==='#space'){cur='space';render()}
if(syncCfg().token)setTimeout(spStart,1500);

}
</script>
